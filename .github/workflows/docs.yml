# Название workflow — будет видно во вкладке Actions на GitHub
name: Build and Deploy Documentation

# ============================================================
# ТРИГГЕРЫ ЗАПУСКА
# ============================================================
on:
  # 1. При push в main, если изменились файлы документации
  push:
    branches:
      - main
    paths:
      - "docs/**" # любые изменения в папке docs/
      - ".github/workflows/docs.yml" # изменения самого workflow

  # 2. Ручной запуск — удобно для принудительного пересобирания
  workflow_dispatch:

# ============================================================
# ПРАВА ДОСТУПА (обязательно для деплоя на Pages)
# ============================================================
permissions:
  contents: read # читать код репозитория
  pages: write # писать на GitHub Pages
  id-token: write # для OIDC-аутентификации (без токенов)

# ============================================================
# КОНКУРЕНТНОСТЬ (не убиваем начатый деплой новым пушем)
# ============================================================
concurrency:
  group: pages
  cancel-in-progress: false

# ============================================================
# JOBS
# ============================================================
jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    # ОКРУЖЕНИЕ (GitHub Pages) — ключ ВНУТРИ job, а не сверху
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # --------------------------------------------------------
      # 1. Клонирование репозитория
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # полная история (для git-revision-date)

      # --------------------------------------------------------
      # 2. Установка Python
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------------
      # 3. Установка MkDocs и плагинов
      # --------------------------------------------------------
      - name: Install MkDocs dependencies
        run: pip install -r requirements.txt

      # --------------------------------------------------------
      # 4. Сборка документации (strict: битые ссылки = ошибка)
      # --------------------------------------------------------
      - name: Build documentation
        run: mkdocs build --strict

      # --------------------------------------------------------
      # 5. Настройка Pages
      # --------------------------------------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # --------------------------------------------------------
      # 6. Загрузка собранного site/ как артефакта
      # --------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # --------------------------------------------------------
      # 7. Деплой на GitHub Pages
      # --------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
